<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GulBoutique | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            color: white;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            min-width: 150px;
        }
        .logout-btn {
            margin-top: 30px;
            background: #e74c3c;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Xoş Gəldiniz, Admin! 🌸</h1>
        <p>GulBoutique İdarəetmə Paneli</p>

        <div class="stats">
            <div class="stat-card">
                <h3>124</h3>
                <p>Yeni Sifariş</p>
            </div>
            <div class="stat-card">
                <h3>15</h3>
                <p>Yeni Müştəri</p>
            </div>
            <div class="stat-card">
                <h3>850 AZN</h3>
                <p>Bugünkü Qazanc</p>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">Sistemdən Çıx</button>
    </div>

    <script>
        function logout() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
