
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GulBoutique - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">GulBoutique</div>
        <p class="subtitle">Zəriflik və Stil Sizinlə</p>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="İstifadəçi adı">
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Şifrə">
        </div>

        <button onclick="login()">Giriş Et</button>

        <div id="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
